<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenZH</title>
    <link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      [hidden] {
        display: none !important;
      }
      html {
        background: #101214;
        color: #d7dade;
      }
      body {
        margin: 0 auto;
        max-width: 48rem;
        padding: 2rem 1.5rem 3rem;
        font: 15px/1.6 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.6rem;
      }
      h2 {
        margin: 2rem 0 0.5rem;
        font-size: 1.15rem;
      }
      p {
        margin: 0.5rem 0;
      }
      .note {
        color: #a7adb5;
      }
      #picker {
        margin-top: 1.5rem;
      }
      #folder-input {
        display: block;
        margin: 0.75rem 0;
        color: inherit;
      }
      #import-progress {
        display: block;
        width: 100%;
        margin: 0.5rem 0;
      }
      #status {
        min-height: 1.6em;
        margin: 0.5rem 0;
      }
      #stored-summary {
        margin: 0.5rem 0;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 0.75rem;
      }
      button {
        padding: 0.5rem 1.1rem;
        border: 1px solid #3a4048;
        border-radius: 6px;
        background: #1c2026;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #262c34;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #play-controls {
        margin-top: 1.5rem;
      }
      #canvas {
        display: block;
        margin-top: 1.5rem;
        margin-inline: auto;
        max-width: 100%;
        max-height: calc(100vh - 12rem);
        background: #000;
      }
      /* Issue #97: from Play on the page is the window's width and the canvas
         takes the space below #play-controls (src/main.ts sizes it), so the
         launcher's column no longer caps the game. The text keeps its readable
         column, and no page padding is left below the canvas to scroll. */
      body.playing {
        max-width: none;
        padding-bottom: 0;
      }
      body.playing h1,
      body.playing main > p.note {
        max-width: 48rem;
      }
      body.playing #canvas {
        margin-top: 0;
        max-width: none;
        max-height: none;
      }
      /* Fullscreen (#91) is #screen's: the canvas is displayed at the largest
         size that fits the screen at the drawing buffer's aspect ratio, and the
         letterbox is the background around it (a stretched canvas would
         misplace the engine's mouse mapping). */
      #screen:fullscreen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #screen:fullscreen #canvas {
        margin: 0;
        max-width: none;
        max-height: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenZH</h1>
      <p class="note">
        Play the game in your browser, from your own copy of the game data: the
        files stay on this computer and are never uploaded. The port is
        compatible with C&amp;C Generals game data.
      </p>

      <section id="picker">
        <h2>Game data</h2>
        <p class="note">Pick the folder of your game installation.</p>
        <p id="unsupported" role="alert" hidden></p>
        <input id="folder-input" type="file" webkitdirectory multiple />
        <progress id="import-progress" hidden></progress>
        <p id="status"></p>
        <p id="storage">Storage: unknown</p>
        <p id="storage-warning" role="status" hidden></p>
        <p id="stored-summary">Stored: 0 archives</p>
        <div class="actions">
          <button id="play" disabled>Play</button>
          <button id="clear">Clear stored archives</button>
        </div>
      </section>

      <div id="engine-error" role="alert" hidden></div>
      <div id="play-controls" hidden>
        <button id="fullscreen">Fullscreen</button>
      </div>
      <div id="screen">
        <canvas id="canvas" width="800" height="600" tabindex="0" hidden></canvas>
      </div>
    </main>
    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
